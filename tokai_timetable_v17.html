<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>东海大学课程选择</title>
  <style>
    :root{--bg:#f5f5f7;--card:rgba(255,255,255,.82);--text:#1d1d1f;--sub:#6e6e73;--line:rgba(0,0,0,.09);--blue:#0071e3;--red:#d70015;--orange:#bf5b00;--shadow:0 8px 28px rgba(0,0,0,.07)}
    *{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","Hiragino Sans","Yu Gothic UI",sans-serif;-webkit-font-smoothing:antialiased}
    button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1680px;margin:auto;padding:18px}
    .hero{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 26px;border-radius:24px;background:linear-gradient(145deg,#fff,rgba(255,255,255,.74));border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow)}
    h1{margin:0;font-size:28px;letter-spacing:-.03em}.hero p{margin:5px 0 0;color:var(--sub);font-size:13px}.credits{text-align:right;white-space:nowrap}.credits strong{font-size:32px;letter-spacing:-.04em}.credits span{display:block;color:var(--sub);font-size:12px}
    .filters,.panel{background:var(--card);border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
    
    .workspace{display:grid;grid-template-columns:510px minmax(0,1fr);gap:12px;margin-top:12px;align-items:start}.panel{border-radius:20px;overflow:hidden;min-width:0}.panel-title{padding:13px 15px;border-bottom:1px solid var(--line);font-size:15px;font-weight:700}
    .timetable-panel{grid-column:1}.course-panel{grid-column:2;grid-row:1}.filters{box-shadow:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px}.search{width:100%;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.8);padding:9px 11px;outline:none}.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,113,227,.12)}
    .filter-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:7px}.select{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px;color:var(--text);font-size:12px}.checks,.result{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:8px;color:var(--sub);font-size:12px}.result{justify-content:space-between}.course-list{padding:9px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}.course-card{border:1px solid var(--line);border-radius:15px;background:#fff;padding:11px;min-width:0}.course-card.selected{border-color:var(--blue);background:#f2f8ff}.course-top{display:flex;justify-content:space-between;gap:8px}.course-name{font-size:14px;font-weight:700;line-height:1.3}.code{font-size:11px;color:var(--sub);margin-top:3px}.meta{font-size:11px;color:var(--sub);line-height:1.5;margin-top:7px}.add{border:0;border-radius:980px;background:#e8f2ff;color:var(--blue);font-weight:700;padding:6px 9px;height:30px}.selected .add{background:#ffe9eb;color:var(--red)}.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.badge{font-size:10px;padding:3px 7px;border-radius:980px;background:#f0f0f2}.badge.retake{color:var(--orange);background:#fff2e5}.variant{width:100%;margin-top:8px;padding:7px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:11px}
    .timetable{display:grid;grid-template-columns:30px repeat(6,1fr);gap:1px;background:var(--line);margin:9px;border:1px solid var(--line);border-radius:13px;overflow:hidden}.cell{background:#fff;min-width:0;min-height:57px;padding:3px}.head{min-height:30px;display:flex;align-items:center;justify-content:center;background:#f1f6fc;font-size:11px;font-weight:700}.period{display:flex;align-items:center;justify-content:center;background:#fafafa;font-size:11px;font-weight:700}.slot{border-left:3px solid var(--blue);border-radius:6px;background:#edf6ff;padding:4px;margin-bottom:3px;font-size:8px;line-height:1.3;overflow-wrap:anywhere}.slot b{display:block;font-size:9px}.remove{float:right;border:0;background:none;color:var(--red);padding:0}.other{margin:0 9px 9px;padding:8px;border-radius:11px;background:#f5f5f7;font-size:10px}.other-items{display:flex;flex-wrap:wrap;gap:5px}.empty{padding:28px;text-align:center;color:var(--sub);font-size:13px}.toast{position:fixed;right:20px;bottom:20px;background:rgba(29,29,31,.92);color:#fff;padding:10px 14px;border-radius:980px;font-size:12px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}
    @media(max-width:1150px){.workspace{grid-template-columns:430px minmax(0,1fr)}.course-list{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}.filter-row{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:850px){.app{padding:10px}.workspace{grid-template-columns:1fr}.timetable-panel,.course-panel{grid-column:1;grid-row:auto}.timetable-panel{order:1}.course-panel{order:2}.course-list{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}.hero{padding:16px}.hero h1{font-size:22px}}
    @media(max-width:560px){.hero{border-radius:18px}.credits strong{font-size:25px}.filter-row{grid-template-columns:1fr}.course-list{grid-template-columns:1fr}.timetable{margin:6px}.cell{min-height:48px}.slot{font-size:7px;padding:3px}.slot b{font-size:8px}}
  
    .timetable-panel{position:sticky;top:12px;align-self:start;max-height:calc(100vh - 24px)}
    .course-list{display:block;padding:12px}
    .course-section{margin:0 0 18px}
    .section-title{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;margin:0 0 8px;padding:9px 12px;border-radius:11px;background:rgba(245,245,247,.94);backdrop-filter:blur(16px);font-size:13px;font-weight:750;color:#3a3a3c}
    .section-title span{font-size:11px;font-weight:500;color:var(--sub)}
    .course-card{position:relative;margin-bottom:8px;padding:14px 92px 13px 15px;border-radius:18px;min-height:118px}
    .course-top{display:block}.course-name{font-size:16px;line-height:1.35;letter-spacing:-.01em}.code{font-size:12px;line-height:1.5;padding-right:2px;overflow-wrap:anywhere}
    .meta{font-size:12px;line-height:1.55;overflow-wrap:anywhere}.add{position:absolute;right:14px;top:16px;width:66px;min-width:66px;height:40px;padding:0;border-radius:999px;font-size:15px;white-space:nowrap;display:flex;align-items:center;justify-content:center;line-height:1}
    .variant{max-width:620px}.badges{padding-right:0}.empty-section{color:var(--sub);font-size:12px}
    @media(max-width:1150px){.workspace{grid-template-columns:400px minmax(0,1fr)}.course-card{padding-right:86px}}
    @media(max-width:850px){.timetable-panel{position:relative;top:auto;max-height:none}.course-card{padding-right:88px}.section-title{top:0}}
    @media(max-width:560px){.course-card{padding:12px 78px 12px 12px}.add{right:10px;top:12px;width:58px;min-width:58px;height:36px;font-size:14px}.course-name{font-size:15px}}

  
    .slot{border-left:0!important;border:1px solid rgba(0,113,227,.14);background:#f3f8ff;padding:5px;border-radius:8px;cursor:pointer;transition:background .16s,opacity .16s,transform .16s}
    .slot:hover{background:#e8f3ff;transform:translateY(-1px)}
    
    .slot-mode{display:inline-flex;align-items:center;margin-top:3px;padding:2px 5px;border-radius:999px;font-size:7px;font-weight:700;line-height:1.2;background:#e5e5ea;color:#515154}
    .slot-mode.remote{background:#eee8ff;color:#6240a8}.slot-mode.inperson{background:#e7f6ed;color:#18794e}
    .course-card.located{outline:3px solid rgba(0,113,227,.22);background:#f2f8ff;animation:locatePulse 1.1s ease}
    @keyframes locatePulse{0%{transform:scale(.99)}45%{transform:scale(1.005)}100%{transform:scale(1)}}

  
    .timetable-cell.empty-slot{cursor:pointer;position:relative;transition:background .15s}
    .timetable-cell.empty-slot:hover{background:#f0f7ff}
    .timetable-cell.empty-slot:hover:after{content:"查看";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--blue);font-size:8px;font-weight:700}
    .course-section.located-section>.section-title{background:#e8f3ff;color:var(--blue);box-shadow:0 0 0 3px rgba(0,113,227,.12)}

  
    .badge.target-class{background:#fff3d6;color:#8a5700;font-weight:650}

  
    .course-card.time-blocked{background:#f1f1f3;border-color:transparent;color:#777;opacity:.68}
    .course-card.time-blocked .meta,.course-card.time-blocked .code{color:#8e8e93}
    .course-card.time-blocked .add{background:#dedee3;color:#777;cursor:not-allowed}
    .day-head{border:0;font-family:inherit;cursor:pointer;color:var(--blue);transition:background .15s}
    .day-head:hover{background:#e5f1ff}
  
    .filter-restore{display:none;align-items:center;justify-content:space-between;gap:10px;margin:10px 12px 0;padding:9px 11px;border-radius:12px;background:#fff7df;color:#704f00;font-size:11px}
    .filter-restore.show{display:flex}
    .filter-restore button{border:0;border-radius:999px;padding:6px 10px;background:#fff;color:#0071e3;font-weight:700;white-space:nowrap}

  
    .data-status{display:inline-flex;align-items:center;gap:7px;margin-top:7px;padding:5px 9px;border-radius:999px;background:#f1f1f3;color:var(--sub);font-size:10px;font-weight:650}
    .data-status:before{content:"";width:7px;height:7px;border-radius:50%;background:#8e8e93}.data-status.loading:before{background:#0071e3;animation:pulse 1s infinite alternate}.data-status.ready:before{background:#30a46c}.data-status.error:before{background:#d70015}@keyframes pulse{to{opacity:.25}}
  
    .weekday-block{margin:0 0 24px}
    .weekday-divider{display:flex;align-items:center;gap:10px;margin:22px 0 10px;padding:0 2px;color:#1d1d1f;font-size:15px;font-weight:760;letter-spacing:-.01em}
    .weekday-divider:first-child{margin-top:5px}
    .weekday-divider:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,rgba(0,0,0,.14),rgba(0,0,0,.025))}
    .weekday-divider span{color:#86868b;font-size:10px;font-weight:600;letter-spacing:0}
    .weekday-periods>.course-section{margin-bottom:13px}

  
    /* Apple-style detail refinements: spacing, hierarchy, and interaction only. */
    :root{--hairline:rgba(0,0,0,.075);--apple-blue:#0071e3;--apple-blue-hover:#0077ed}
    body{letter-spacing:-.006em}
    .hero{border-color:rgba(255,255,255,.82);box-shadow:0 10px 32px rgba(0,0,0,.055)}
    .hero h1{letter-spacing:-.035em;font-weight:720}
    .panel{border-color:rgba(255,255,255,.84);box-shadow:0 8px 26px rgba(0,0,0,.055)}
    .panel-title{letter-spacing:-.012em}
    .filters{background:rgba(255,255,255,.7)}
    .search,.select,.variant{transition:border-color .16s ease,box-shadow .16s ease,background .16s ease}
    .select:hover,.variant:hover{border-color:rgba(0,0,0,.17)}
    .course-card{border-color:var(--hairline);box-shadow:0 1px 1px rgba(0,0,0,.018);transition:background .17s ease,border-color .17s ease,box-shadow .17s ease,transform .17s ease}
    .course-card:not(.time-blocked):hover{border-color:rgba(0,113,227,.20);box-shadow:0 5px 18px rgba(0,0,0,.055);transform:translateY(-1px)}
    .course-card.selected{box-shadow:0 0 0 1px rgba(0,113,227,.08),0 5px 18px rgba(0,113,227,.07)}
    .course-name{letter-spacing:-.018em;font-weight:720}
    .code,.meta{letter-spacing:-.004em}
    .add{background:#eaf3ff;transition:background .16s ease,color .16s ease,transform .12s ease}
    .add:not(:disabled):hover{background:#dcecff;color:var(--apple-blue-hover)}
    .add:not(:disabled):active{transform:scale(.96)}
    .badge{border:1px solid rgba(0,0,0,.025)}
    .weekday-divider{letter-spacing:-.018em}
    .section-title{background:rgba(245,245,247,.88);border:1px solid rgba(0,0,0,.025)}
    .timetable{border-color:rgba(0,0,0,.085);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.7)}
    .cell{transition:background .15s ease}
    .slot{border-color:rgba(0,113,227,.10);box-shadow:0 1px 2px rgba(0,0,0,.025);transition:background .16s ease,box-shadow .16s ease,transform .16s ease}
    .slot:hover{box-shadow:0 3px 9px rgba(0,0,0,.07)}
    .slot-code{margin-top:3px;color:#515154;font-size:7px;font-weight:720;letter-spacing:.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .slot-mode{vertical-align:middle}
    .data-status{border:1px solid rgba(0,0,0,.035)}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.course-card,.slot,.add,.search,.select,.variant{transition:none!important}.data-status.loading:before{animation:none}}

  
    .badge.requirement{font-weight:720}
    .badge.requirement.required{background:#e8f3ff;color:#0066cc;border-color:rgba(0,102,204,.08)}
    .badge.requirement.elective{background:#f1f1f3;color:#515154;border-color:rgba(0,0,0,.035)}

  
    @media(max-width:1280px){.filter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:650px){.filter-grid{grid-template-columns:1fr}}

  </style>
</head>
<body>
<div class="app">
  <header class="hero"><div><h1>课程选择</h1><p id="sourceText">载入课程 JSON 后开始安排</p><div class="data-status loading" id="dataStatus">正在获取最新课程数据</div></div><div class="credits"><strong id="creditTotal">0.0</strong><span><b id="selectedCount">0</b> 门课程 · 已选学分</span></div></header>
  <main class="workspace">
    <section class="panel timetable-panel"><div class="panel-title">星期课表</div><div class="timetable" id="timetable"></div><div class="other"><b>其他时间</b><div class="other-items" id="otherList">暂无</div></div></section>
    <section class="panel course-panel">
      <div class="panel-title">选择课程</div>
      <div class="filters">
        <input class="search" id="keyword" placeholder="搜索课程、教师、代码、教室或备注">
        <div class="filter-row">
          <select class="select" id="gradeFilter"><option value="">全部年级</option><option value="1">1年级</option><option value="2">2年级</option><option value="3">3年级</option><option value="4">4年级</option></select>
          
          <select class="select" id="typeFilter"><option value="">全部形式</option><option value="面接">面接</option><option value="遠隔">遠隔</option></select>
          <select class="select" id="retakeFilter"><option value="hide">隐藏再履修</option><option value="all">显示全部</option><option value="only">只看再履修</option></select><select class="select" id="requirementFilter"><option value="">全部类别</option><option value="required">必修</option><option value="elective">选修</option></select>
        </div>
        <div class="checks"><label><input type="checkbox" id="excludeOtherClasses" checked> 排除非6C/6Ｃ对象课程</label><label><input type="checkbox" id="hideGraduation" checked> 隐藏卒業研究</label></div>
        <div class="result"><span id="resultCount">0 项课程</span></div>
      </div>
      <div class="course-list" id="courseList"><div class="empty">请先载入课程 JSON</div></div>
    </section>
  </main>
</div><div class="toast" id="toast"></div>
<script>
'use strict';
const GIST_ID='ddfdf60dbff075ff8b810b84232cca21',GIST_API=`https://api.github.com/gists/${GIST_ID}`,SCHEMA='tokai-timetable-v1',DAYS=['月','火','水','木','金','土'],PERIODS=[1,2,3,4,5,6,7];
let courses=[],variantChoice={};
let selected=new Set(JSON.parse(localStorage.getItem('tokaiSelected')||'[]'));
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const key=c=>c.id;
const meetings=c=>c.schedule.meetings;
const norm=v=>String(v||'').normalize('NFKC').replace(/\s+/g,'').toLowerCase();
const scheduleKey=c=>meetings(c).map(m=>`${m.day||'他'}${m.period||''}`).sort().join('|')||`other:${norm(c.schedule?.raw||'未定')}`;
const mergeKey=c=>`${norm(c.name)}@@${scheduleKey(c)}`;
const graduation=c=>c.flags.graduation;
const retake=c=>c.flags.retake;
function targetClassCodes(c){return c.flags.target_classes}function excludedFor6C(c){return !c.flags.allowed_for_6c}
function groups(list){const map=new Map();for(const c of list){const k=mergeKey(c);if(!map.has(k))map.set(k,{key:k,name:c.name,variants:[]});map.get(k).variants.push(c)}return [...map.values()].sort((a,b)=>String(a.name).localeCompare(String(b.name),'ja'))}
function years(c){return c.grade_years}
function displayGrades(c){return c.grades_raw?c.grade_years.map(x=>x+'年').join('、'):''}

function chosen(){return courses.filter(c=>selected.has(key(c)))}
function timeSlots(c){return new Set(meetings(c).filter(m=>m.day&&m.period).map(m=>`${m.day}-${m.period}`))}
function conflictingSelected(c){const slots=timeSlots(c);return chosen().filter(x=>key(x)!==key(c)&&[...timeSlots(x)].some(s=>slots.has(s)))}
function hasSelectionConflict(c){return conflictingSelected(c).length>0}
function match(c){const q=$('keyword').value.trim().toLowerCase(),hay=[c.name,c.teacher,c.class_code,c.note,c.schedule?.room,c.schedule?.raw].join(' ').toLowerCase();if(q&&!hay.includes(q))return false;const g=$('gradeFilter').value;if(g&&!years(c).includes(+g))return false;if($('typeFilter').value&&c.class_type!==$('typeFilter').value)return false;if($('requirementFilter').value&&c.requirement_type!==$('requirementFilter').value)return false;const r=$('retakeFilter').value;if(r==='hide'&&retake(c))return false;if(r==='only'&&!retake(c))return false;if($('excludeOtherClasses').checked&&excludedFor6C(c))return false;if($('hideGraduation').checked&&graduation(c))return false;return true}
function timeRank(c){const ms=meetings(c);if(!ms.length)return 999;const dayRank={月:0,火:1,水:2,木:3,金:4,土:5,日:6,他:8};return Math.min(...ms.map(m=>(dayRank[m.day]??9)*20+(Number(m.period)||9)))}
function sectionToken(c){const m=meetings(c)[0];return m&&DAYS.includes(m.day)&&m.period?`${m.day}-${m.period}`:'other'}
function jumpToDay(day){
 $('keyword').value='';renderCourses();
 requestAnimationFrame(()=>{
  const target=document.querySelector(`.weekday-block[data-weekday="${CSS.escape(day)}"]`);
  if(target){target.scrollIntoView({behavior:'smooth',block:'start'});const title=target.querySelector('.weekday-divider');title?.classList.add('located-section');setTimeout(()=>title?.classList.remove('located-section'),1200)}
  else toast(`${day}曜日没有符合当前筛选的课程`)
 })
}
function jumpToTime(day,period){
  
  $('keyword').value='';
  renderCourses();
  requestAnimationFrame(()=>{
    const target=document.querySelector(`.course-section[data-time-section="${CSS.escape(`${day}-${period}`)}"]`);
    if(target){target.scrollIntoView({behavior:'smooth',block:'start'});target.classList.add('located-section');setTimeout(()=>target.classList.remove('located-section'),1200)}
  });
}
function renderCourses(){
 const visible=courses.filter(match),list=groups(visible).map(g=>{
  g.variants.sort((a,b)=>timeRank(a)-timeRank(b)||String(a.teacher||'').localeCompare(String(b.teacher||''),'ja'));
  g.sample=g.variants.find(v=>key(v)===variantChoice[g.key])||g.variants.find(v=>selected.has(key(v)))||g.variants[0];
  return g
 }).sort((a,b)=>timeRank(a.sample)-timeRank(b.sample)||String(a.name).localeCompare(String(b.name),'ja'));
 $('resultCount').textContent=`${list.length} 项课程 / ${visible.length} 个班级`;
 if(!list.length){$('courseList').innerHTML='<div class="empty">没有符合条件的课程</div>';return}

 const days=new Map();
 for(const g of list){
  const first=meetings(g.sample)[0],day=first&&DAYS.includes(first.day)?first.day:'其他';
  const period=first?.period?String(first.period):'other';
  if(!days.has(day))days.set(day,new Map());
  const periods=days.get(day);
  if(!periods.has(period))periods.set(period,[]);
  periods.get(period).push(g)
 }

 const card=g=>{
  const c=g.sample,already=g.variants.find(v=>selected.has(key(v))),blocked=!already&&hasSelectionConflict(c),blockedBy=blocked?conflictingSelected(c).map(x=>x.name).join('、'):'',options=g.variants.map(v=>`<option value="${esc(key(v))}" ${key(v)===key(c)?'selected':''}>${esc(v.teacher||'教师未填写')} · ${esc(v.schedule?.room||v.class_type||'教室未填写')} · ${esc(v.class_code)}</option>`).join('');
  return `<article class="course-card ${already?'selected':blocked?'time-blocked':''}" data-course-key="${esc(key(c))}" ${blocked?`title="时间冲突：${esc(blockedBy)}"`:''}><button class="add" data-group="${esc(g.key)}" ${blocked?'disabled':''}>${already?'移除':blocked?'冲突':'加入'}</button><div class="course-top"><div><div class="course-name">${esc(g.name)}</div><div class="code">${esc(c.class_code)} · ${Number(c.credits||0).toFixed(1)} 学分 · ${esc(c.schedule?.raw||'无固定时间')}</div></div></div><div class="meta">${esc(c.teacher||'教师未填写')}${c.note?`<br>${esc(c.note)}`:''}</div><div class="badges">${c.class_type==='遠隔'?'<span class="badge">远程</span>':''}${c.requirement_label?`<span class="badge requirement ${c.requirement_type||''}">${esc(c.requirement_label)}</span>`:''}${retake(c)?'<span class="badge retake">再履修</span>':''}${targetClassCodes(c).length?`<span class="badge target-class">对象 ${esc(targetClassCodes(c).join(' / '))}</span>`:''}${displayGrades(c)?`<span class="badge">${esc(displayGrades(c))}</span>`:''}</div>${g.variants.length>1?`<select class="variant" data-group="${esc(g.key)}">${options}</select>`:''}</article>`
 };

 $('courseList').innerHTML=[...days].map(([day,periods])=>{
  const courseTotal=[...periods.values()].reduce((sum,items)=>sum+items.length,0);
  const periodHtml=[...periods].map(([period,items])=>{
   const title=period==='other'?'其他时间或无固定时限':`${day}曜日 · 第${period}时限`;
   const token=period==='other'?'other':`${day}-${period}`;
   return `<section class="course-section" data-time-section="${esc(token)}"><div class="section-title">${esc(title)}</div>${items.map(card).join('')}</section>`
  }).join('');
  return `<section class="weekday-block" data-weekday="${esc(day)}"><div class="weekday-divider">${esc(day==='其他'?'其他时间':day+'曜日')}<span>${courseTotal} 项课程</span></div><div class="weekday-periods">${periodHtml}</div></section>`
 }).join('');

 document.querySelectorAll('.variant').forEach(el=>el.onchange=()=>{
  const group=list.find(x=>x.key===el.dataset.group),old=group.variants.find(v=>selected.has(key(v))),candidate=group.variants.find(v=>key(v)===el.value);
  variantChoice[group.key]=el.value;
  if(old&&hasSelectionConflict(candidate))return toast('这个班级与已选课程冲突');
  if(old){selected.delete(key(old));selected.add(key(candidate));save();render()}else renderCourses()
 });
 document.querySelectorAll('.add').forEach(el=>el.onclick=()=>{
  const group=list.find(x=>x.key===el.dataset.group),old=group.variants.find(v=>selected.has(key(v)));
  if(old)selected.delete(key(old));
  else{const candidate=group.variants.find(v=>key(v)===variantChoice[group.key])||group.variants[0];if(hasSelectionConflict(candidate))return toast('该时间已有课程，不能重复添加');selected.add(key(candidate))}
  save();render()
 })
}
function copyClassCodeSilently(course){
 const text=String(course?.class_code||'');
 if(!text)return;
 if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).catch(()=>fallbackCopy(text));return}
 fallbackCopy(text)
}
function fallbackCopy(text){
 const area=document.createElement('textarea');area.value=text;area.setAttribute('readonly','');area.style.position='fixed';area.style.opacity='0';area.style.pointerEvents='none';document.body.appendChild(area);area.select();try{document.execCommand('copy')}catch(_error){}area.remove()
}
function locateCourse(courseKey){const course=courses.find(c=>key(c)===courseKey);if(!course)return;copyClassCodeSilently(course);if(!match(course))return;const group=groups(courses).find(g=>g.variants.some(v=>key(v)===courseKey));if(group)variantChoice[group.key]=courseKey;renderCourses();requestAnimationFrame(()=>{const card=document.querySelector(`.course-card[data-course-key="${CSS.escape(courseKey)}"]`);if(card){card.scrollIntoView({behavior:'smooth',block:'center'});card.classList.add('located');setTimeout(()=>card.classList.remove('located'),1400)}})}
function renderTable(){const picked=chosen();let h='<div class="cell head">限</div>'+DAYS.map(d=>`<button class="cell head day-head" data-jump-day="${d}" title="查看${d}曜日课程">${d}</button>`).join('');for(const p of PERIODS){h+=`<div class="cell period">${p}</div>`;for(const d of DAYS){const slot=picked.filter(c=>meetings(c).some(m=>m.day===d&&+m.period===p));h+=`<div class="cell timetable-cell ${slot.length?'':'empty-slot'}" data-day="${d}" data-period="${p}" title="${slot.length?'':'点击查看这个时间的课程'}">${slot.map(c=>`<div class="slot" data-locate="${esc(key(c))}" title="点击定位到课程详情"><button class="remove" data-key="${esc(key(c))}">×</button><b>${esc(c.name)}</b>${esc(c.teacher||'')}<div class="slot-mode ${c.class_type==='遠隔'?'remote':'inperson'}">${c.class_type==='遠隔'?'网课':'面授'}</div><div class="slot-code">${esc(c.class_code)}</div></div>`).join('')}</div>`}}$('timetable').innerHTML=h;document.querySelectorAll('.remove').forEach(b=>b.onclick=e=>{e.stopPropagation();remove(b.dataset.key)});document.querySelectorAll('.slot[data-locate]').forEach(el=>el.onclick=e=>{e.stopPropagation();locateCourse(el.dataset.locate)});document.querySelectorAll('.empty-slot').forEach(el=>el.onclick=()=>jumpToTime(el.dataset.day,el.dataset.period));document.querySelectorAll('.day-head').forEach(el=>el.onclick=()=>jumpToDay(el.dataset.jumpDay));const other=picked.filter(c=>!meetings(c).some(m=>DAYS.includes(m.day)&&m.period));$('otherList').innerHTML=other.length?other.map(c=>`<span class="badge">${esc(c.name)} <button class="remove" data-key="${esc(key(c))}">×</button></span>`).join(''):'暂无';document.querySelectorAll('#otherList .remove').forEach(b=>b.onclick=e=>{e.stopPropagation();remove(b.dataset.key)})}
function render(){renderCourses();renderTable();const picked=chosen();$('selectedCount').textContent=picked.length;$('creditTotal').textContent=picked.reduce((s,c)=>s+Number(c.credits||0),0).toFixed(1)}
function remove(k){selected.delete(k);save();render()}function save(){localStorage.setItem('tokaiSelected',JSON.stringify([...selected]))}
function setDataStatus(text,state){const el=$('dataStatus');el.textContent=text;el.className=`data-status ${state}`}
function selectGistJson(files){const list=Object.values(files||{});return list.find(f=>f.filename?.toLowerCase().endsWith('.json')&&f.content?.includes('"schema"'))||list.find(f=>f.filename?.toLowerCase().endsWith('.json'))}
async function loadLatestCourses(){
 setDataStatus('正在获取最新课程数据','loading');
 try{
  const response=await fetch(GIST_API,{headers:{Accept:'application/vnd.github+json'},cache:'no-store'});
  if(!response.ok)throw new Error(`GitHub Gist 请求失败：HTTP ${response.status}`);
  const gist=await response.json(),file=selectGistJson(gist.files);
  if(!file)throw new Error('Gist 中没有找到 JSON 文件');
  let text=file.content;
  if(file.truncated||!text){const raw=await fetch(file.raw_url,{cache:'no-store'});if(!raw.ok)throw new Error(`JSON 下载失败：HTTP ${raw.status}`);text=await raw.text()}
  const data=JSON.parse(text);
  if(data.schema!==SCHEMA||!Array.isArray(data.courses))throw new Error(`数据格式必须是 ${SCHEMA}`);
  courses=data.courses;
  selected=new Set([...selected].filter(id=>courses.some(c=>key(c)===id)));
  $('sourceText').textContent=`${data.source_pdf||file.filename} · ${courses.length} 门课程`;
  save();render();setDataStatus(`已同步最新数据 · ${file.filename}`,'ready');
 }catch(error){console.error(error);setDataStatus('课程数据获取失败','error');$('sourceText').textContent=error.message;$('courseList').innerHTML='<div class="empty">无法从 GitHub Gist 获取课程数据，请检查网络及 Gist 中的 JSON 文件。</div>'}
}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1500)}
['keyword','gradeFilter','typeFilter','retakeFilter','requirementFilter','excludeOtherClasses','hideGraduation'].forEach(id=>$(id).addEventListener(id==='keyword'?'input':'change',renderCourses));
renderTable();loadLatestCourses();
</script>
