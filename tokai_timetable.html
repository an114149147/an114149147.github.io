<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>东海大学课程选择</title><style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--sub:#6e6e73;--line:rgba(0,0,0,.08);--blue:#0071e3;--red:#d70015}*{box-sizing:border-box}html{scroll-behavior:smooth;background:var(--bg)}body{margin:0;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Hiragino Sans",sans-serif;-webkit-font-smoothing:antialiased}button,input,select{font:inherit}.app{max-width:1680px;margin:auto;padding:16px}.hero,.panel{background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.9);box-shadow:0 8px 28px rgba(0,0,0,.06);backdrop-filter:blur(20px)}.hero{padding:20px 24px;border-radius:22px}.hero h1{margin:0;font-size:27px;letter-spacing:-.035em}.hero p{margin:5px 0 0;color:var(--sub);font-size:12px}.status{display:inline-flex;gap:7px;align-items:center;margin-top:7px;padding:5px 9px;border-radius:999px;background:#f1f1f3;color:var(--sub);font-size:10px;font-weight:650}.status:before{content:"";width:7px;height:7px;border-radius:50%;background:#0071e3}.status.ready:before{background:#30a46c}.status.error:before{background:var(--red)}.workspace{display:grid;grid-template-columns:500px minmax(0,1fr);gap:12px;margin-top:12px;align-items:start}.panel{min-width:0;border-radius:20px;overflow:hidden}.table-panel{position:sticky;top:12px}.panel-title{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;border-bottom:1px solid var(--line);font-size:15px;font-weight:760}.summary{color:var(--sub);font-size:11px}.summary b{color:var(--text);font-size:12px}.timetable{display:grid;grid-template-columns:30px repeat(6,1fr);gap:1px;margin:9px;background:var(--line);border:1px solid var(--line);border-radius:13px;overflow:hidden}.cell{min-width:0;min-height:57px;padding:3px;border:0;background:#fff}.head{min-height:30px;display:flex;align-items:center;justify-content:center;background:#f1f6fc;font-size:11px;font-weight:720}.day{color:var(--blue);cursor:pointer}.day:disabled{color:#aeaeb2;cursor:default;background:#f5f5f7}.period{display:flex;align-items:center;justify-content:center;background:#fafafa;font-size:11px;font-weight:720}.empty-slot.available{background:#fbfdff;cursor:pointer}.empty-slot.available:hover{background:#edf6ff}.empty-slot.unavailable{background:#f7f7f8}.slot{position:relative;margin-bottom:3px;padding:5px 5px 4px;border:1px solid rgba(0,113,227,.1);border-radius:9px;background:#f7faff;cursor:pointer;overflow:hidden}.slot.filtered{background:#ededf0;color:#7d7d82;opacity:.7}.slot b{display:-webkit-box;padding-right:10px;overflow:hidden;-webkit-box-orient:vertical;-webkit-line-clamp:3;font-size:8px;font-weight:730;line-height:1.16;overflow-wrap:anywhere}.teacher{display:block;margin-top:3px;overflow:hidden;color:#6e6e73;font-size:6.5px;text-overflow:ellipsis;white-space:nowrap}.slot-footer{display:flex;align-items:center;gap:2px;margin-top:4px;min-height:14px}.slot-code{min-width:0;overflow:hidden;color:#515154;font-size:6.5px;font-weight:720;text-overflow:ellipsis;white-space:nowrap}.credits{margin-right:auto;color:#86868b;font-size:6.5px}.tag{display:inline-flex;align-items:center;justify-content:center;min-width:13px;height:13px;padding:0 3px;border-radius:999px;background:#e7f6ed;color:#18794e;font-size:6.5px;font-weight:760}.tag.remote{background:#eee8ff;color:#6240a8}.tag.required{background:#e8f3ff;color:#0066cc}.tag.elective{background:#f0f0f2;color:#515154}.remove{position:absolute;top:3px;right:3px;width:11px;height:11px;padding:0;border:0;background:transparent;color:var(--red);font-size:8px;line-height:11px;cursor:pointer}.other{margin:0 9px 9px;padding:8px;border-radius:11px;background:#f5f5f7;font-size:10px}.filters{padding:10px;border-bottom:1px solid var(--line)}.search,.select,.variant{width:100%;padding:8px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,113,227,.12)}.filter-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:7px}.checks,.result{display:flex;gap:13px;flex-wrap:wrap;margin-top:8px;color:var(--sub);font-size:11px}.course-list{padding:11px}.weekday{margin-bottom:30px;scroll-margin-top:14px}.weekday-title{margin:24px 0 13px;padding:9px 12px;border-radius:12px;background:#f1f1f3;font-size:15px;font-weight:760}.period-group{margin-bottom:16px;padding-left:12px;border-left:1px solid rgba(0,0,0,.065);scroll-margin-top:14px}.period-title{margin:0 0 7px;padding:2px 0;color:#515154;font-size:12px;font-weight:720}.course{position:relative;margin-bottom:8px;padding:14px 92px 13px 15px;border:1px solid var(--line);border-radius:18px;background:#fff;min-height:118px}.course.selected{border-color:var(--blue);background:#f2f8ff}.course.blocked{background:#f1f1f3;color:#777;opacity:.68}.course-name{font-size:16px;font-weight:730}.code,.meta{margin-top:5px;color:var(--sub);font-size:12px;line-height:1.55}.add{position:absolute;right:14px;top:16px;width:66px;height:40px;border:0;border-radius:999px;background:#eaf3ff;color:var(--blue);font-size:15px;font-weight:750;cursor:pointer}.selected .add{background:#ffe9eb;color:var(--red)}.blocked .add{background:#dedee3;color:#777}.hide{position:absolute;right:14px;top:60px;width:66px;padding:4px;border:0;background:transparent;color:#86868b;font-size:10px;cursor:pointer}.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.badge{padding:3px 7px;border-radius:999px;background:#f1f1f3;font-size:10px}.badge.required{background:#e8f3ff;color:#0066cc}.badge.retake{background:#fff2e5;color:#bf5b00}.variant{margin-top:8px;font-size:11px}.group-flash{animation:flash 1.15s ease}@keyframes flash{45%{background:#e8f3ff}}.empty{padding:30px;text-align:center;color:var(--sub);font-size:12px}.toast{position:fixed;right:18px;bottom:18px;padding:9px 13px;border-radius:999px;background:#1d1d1f;color:#fff;font-size:11px;opacity:0}.toast.show{opacity:1}@media(max-width:1280px){.workspace{grid-template-columns:430px minmax(0,1fr)}.filter-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:850px){.workspace{grid-template-columns:1fr}.table-panel{position:relative}.filter-grid{grid-template-columns:1fr}.app{padding:8px}}
</style></head><body><div class="app"><header class="hero"><h1>课程选择</h1><p id="source">正在连接课程数据</p><div id="status" class="status">正在获取最新课程数据</div></header><main class="workspace"><section class="panel table-panel"><div class="panel-title"><span>星期课表</span><span class="summary"><b id="count">0</b> 门课程 · <b id="total">0.0</b> 学分</span></div><div id="table" class="timetable"></div><div class="other"><b>其他时间</b><div id="other">暂无</div></div></section><section class="panel"><div class="panel-title">选择课程</div><div class="filters"><input id="search" class="search" placeholder="搜索课程、教师、代码、教室或备注"><div class="filter-grid"><select id="grade" class="select"><option value="">全部年级</option><option value="1">1年级</option><option value="2">2年级</option><option value="3">3年级</option><option value="4">4年级</option></select><select id="type" class="select"><option value="">全部形式</option><option value="面接">面接</option><option value="遠隔">遠隔</option></select><select id="requirement" class="select"><option value="">全部类别</option><option value="required">必修</option><option value="elective">选修</option></select><select id="retake" class="select"><option value="hide">隐藏再履修</option><option value="all">显示全部</option><option value="only">只看再履修</option></select><select id="visibility" class="select"><option value="normal">可选课程</option><option value="all">全部课程</option><option value="hidden">已隐藏课程</option></select></div><div class="checks"><label><input id="sixc" type="checkbox" checked> 排除非6C对象课程</label><label><input id="graduation" type="checkbox" checked> 隐藏卒業研究</label></div><div class="result"><span id="result">0 项课程</span></div></div><div id="list" class="course-list"><div class="empty">正在加载课程</div></div></section></main></div><div id="toast" class="toast"></div><script>
'use strict';
const $=id=>document.getElementById(id),DAYS=['月','火','水','木','金','土'],PERIODS=[1,2,3,4,5,6],SCHEMA='tokai-timetable-v1',API='https://api.github.com/gists/ddfdf60dbff075ff8b810b84232cca21';let courses=[],variant={},selected=new Set(JSON.parse(localStorage.getItem('tokaiSelected')||'[]')),hidden=new Set(JSON.parse(localStorage.getItem('tokaiHidden')||'[]'));const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),key=c=>c.id,meet=c=>c.schedule.meetings,norm=v=>String(v||'').normalize('NFKC').replace(/\s+/g,'').toLowerCase(),mergeKey=c=>`${norm(c.name)}@@${meet(c).map(m=>`${m.day}${m.period||''}`).sort().join('|')||norm(c.schedule.raw)}`,picked=()=>courses.filter(c=>selected.has(key(c))),slots=c=>new Set(meet(c).filter(m=>m.period).map(m=>`${m.day}-${m.period}`));
function groups(a){const m=new Map;for(const c of a){const k=mergeKey(c);if(!m.has(k))m.set(k,{key:k,name:c.name,variants:[]});m.get(k).variants.push(c)}return[...m.values()]}function conflicts(c){const s=slots(c);return picked().filter(x=>key(x)!==key(c)&&[...slots(x)].some(v=>s.has(v)))}function match(c){const mode=$('visibility').value,h=hidden.has(key(c)),q=$('search').value.trim().toLowerCase(),hay=[c.name,c.teacher,c.class_code,c.note,c.schedule.raw,c.schedule.room].join(' ').toLowerCase();return!(mode==='normal'&&h||mode==='hidden'&&!h)&&(!q||hay.includes(q))&&(!$('grade').value||c.grade_years.includes(+$('grade').value))&&(!$('type').value||c.class_type===$('type').value)&&(!$('requirement').value||c.requirement_type===$('requirement').value)&&!($('retake').value==='hide'&&c.flags.retake)&&!($('retake').value==='only'&&!c.flags.retake)&&!($('sixc').checked&&!c.flags.allowed_for_6c)&&!($('graduation').checked&&c.flags.graduation)}const rank=c=>{const o={月:0,火:1,水:2,木:3,金:4,土:5,他:8};return Math.min(...(meet(c).length?meet(c).map(m=>(o[m.day]??9)*20+(+m.period||9)):[999]))},save=()=>{localStorage.setItem('tokaiSelected',JSON.stringify([...selected]));localStorage.setItem('tokaiHidden',JSON.stringify([...hidden]))},notify=t=>{$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1200)};
function renderList(){const visible=courses.filter(match),list=groups(visible).map(g=>{g.variants.sort((a,b)=>rank(a)-rank(b));g.current=g.variants.find(v=>key(v)===variant[g.key])||g.variants.find(v=>selected.has(key(v)))||g.variants[0];return g}).sort((a,b)=>rank(a.current)-rank(b.current)||String(a.name).localeCompare(String(b.name),'ja'));$('result').textContent=`${list.length} 项课程 / ${visible.length} 个班级`;const ds=new Map;for(const g of list){const m=meet(g.current)[0],d=m&&DAYS.includes(m.day)?m.day:'其他',p=m?.period||'other';if(!ds.has(d))ds.set(d,new Map);if(!ds.get(d).has(p))ds.get(d).set(p,[]);ds.get(d).get(p).push(g)}const card=g=>{const c=g.current,on=g.variants.find(v=>selected.has(key(v))),blocked=!on&&conflicts(c).length,opts=g.variants.map(v=>`<option value="${esc(key(v))}">${esc(v.teacher||'教师未填写')} · ${esc(v.schedule.room||v.class_type)} · ${esc(v.class_code)}</option>`).join('');return`<article class="course ${on?'selected':blocked?'blocked':''}"><button class="add" data-g="${esc(g.key)}" ${blocked?'disabled':''}>${on?'移除':blocked?'冲突':'加入'}</button><button class="hide" data-hide="${esc(key(c))}">${hidden.has(key(c))?'取消隐藏':'隐藏'}</button><div class="course-name">${esc(g.name)}</div><div class="code">${esc(c.class_code)} · ${Number(c.credits||0).toFixed(1)} 学分 · ${esc(c.schedule.raw||'无固定时间')}</div><div class="meta">${esc(c.teacher||'教师未填写')}${c.note?`<br>${esc(c.note)}`:''}</div><div class="badges">${c.class_type==='遠隔'?'<span class="badge">遠隔</span>':''}${c.requirement_label?`<span class="badge ${c.requirement_type==='required'?'required':''}">${esc(c.requirement_label)}</span>`:''}${c.flags.retake?'<span class="badge retake">再履修</span>':''}</div>${g.variants.length>1?`<select class="variant" data-g="${esc(g.key)}">${opts}</select>`:''}</article>`};$('list').innerHTML=[...ds].map(([d,ps])=>`<section class="weekday" data-day="${d}"><div class="weekday-title">${d==='其他'?'其他时间':d+'曜日'}</div>${[...ps].map(([p,a])=>`<section class="period-group" data-time="${d}-${p}"><div class="period-title">${p==='other'?'无固定时限':`${d}${p}`}</div>${a.map(card).join('')}</section>`).join('')}</section>`).join('')||'<div class="empty">没有符合条件的课程</div>';document.querySelectorAll('[data-hide]').forEach(b=>b.onclick=()=>{const id=b.dataset.hide;hidden.has(id)?hidden.delete(id):hidden.add(id);save();render()});document.querySelectorAll('.add').forEach(b=>b.onclick=()=>{const g=list.find(x=>x.key===b.dataset.g),old=g.variants.find(v=>selected.has(key(v)));if(old)selected.delete(key(old));else{const c=g.current;if(conflicts(c).length)return notify('该时间已有课程');selected.add(key(c))}save();render()})}
function flashGroup(selector){const e=document.querySelector(selector);if(!e)return;e.scrollIntoView({behavior:'smooth',block:'start'});e.classList.add('group-flash');setTimeout(()=>e.classList.remove('group-flash'),1200)}function jumpDay(d){renderList();requestAnimationFrame(()=>flashGroup(`.weekday[data-day="${d}"]`))}function jumpTime(d,p){renderList();requestAnimationFrame(()=>flashGroup(`[data-time="${d}-${p}"]`))}function copy(c){navigator.clipboard?.writeText(c.class_code).catch(()=>{})}
function renderTable(){const chosen=picked(),available=courses.filter(match),slotSet=new Set(available.flatMap(c=>meet(c).filter(m=>m.period).map(m=>`${m.day}-${m.period}`))),days=new Set([...slotSet].map(k=>k.split('-')[0]));let out='<div class="cell head">限</div>'+DAYS.map(d=>`<button class="cell head day" data-day="${d}" ${days.has(d)?'':'disabled'}>${d}</button>`).join('');for(const p of PERIODS){out+=`<div class="cell period">${p}</div>`;for(const d of DAYS){const list=chosen.filter(c=>meet(c).some(m=>m.day===d&&+m.period===p)),ok=slotSet.has(`${d}-${p}`);out+=`<div class="cell empty-slot ${ok?'available':'unavailable'}" ${ok?`data-timejump="${d}-${p}"`:''}>${list.map(c=>`<div class="slot ${match(c)?'':'filtered'}" data-course="${esc(key(c))}" title="${esc(c.name)} · ${esc(c.teacher||'')} · ${esc(c.class_code)}"><button class="remove" data-remove="${esc(key(c))}">×</button><b>${esc(c.name)}</b><span class="teacher">${esc(c.teacher||'')}</span><div class="slot-footer"><span class="slot-code">${esc(c.class_code)}</span><span class="credits">${Number(c.credits||0).toFixed(1)}</span><span class="tag ${c.class_type==='遠隔'?'remote':''}">${c.class_type==='遠隔'?'遠':'面'}</span>${c.requirement_label?`<span class="tag ${c.requirement_type||''}">${c.requirement_type==='required'?'必':'选'}</span>`:''}</div></div>`).join('')}</div>`}}$('table').innerHTML=out;document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=e=>{e.stopPropagation();selected.delete(b.dataset.remove);save();render()});document.querySelectorAll('[data-course]').forEach(e=>e.onclick=x=>{x.stopPropagation();const c=courses.find(v=>key(v)===e.dataset.course);if(c)copy(c)});document.querySelectorAll('[data-timejump]').forEach(e=>e.onclick=()=>{const[d,p]=e.dataset.timejump.split('-');jumpTime(d,p)});document.querySelectorAll('.day:not(:disabled)').forEach(e=>e.onclick=()=>jumpDay(e.dataset.day));const other=chosen.filter(c=>!meet(c).some(m=>DAYS.includes(m.day)&&m.period));$('other').innerHTML=other.length?other.map(c=>esc(c.name)).join(' · '):'暂无'}function render(){renderList();renderTable();const a=picked();$('count').textContent=a.length;$('total').textContent=a.reduce((s,c)=>s+Number(c.credits||0),0).toFixed(1)}async function load(){try{const r=await fetch(API,{cache:'no-store'}),gist=await r.json(),f=Object.values(gist.files||{}).find(x=>x.filename?.endsWith('.json'));let text=f.content;if(f.truncated){text=await(await fetch(f.raw_url,{cache:'no-store'})).text()}const data=JSON.parse(text);if(data.schema!==SCHEMA)throw Error('数据格式不正确');courses=data.courses;$('source').textContent=`${data.source_pdf||f.filename} · ${courses.length} 门课程`;const date=new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',timeZone:'Asia/Tokyo'}).format(new Date(gist.updated_at));$('status').textContent=`已同步最新数据 · ${f.filename} · 数据更新：${date}`;$('status').className='status ready';render()}catch(e){$('status').textContent='课程数据获取失败';$('status').className='status error'}}['search','grade','type','requirement','retake','visibility','sixc','graduation'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));renderTable();load();
</script></body></html>
