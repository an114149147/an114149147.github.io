<div class="app"><header class="hero"><h1>课程选择</h1><p id="source">正在读取课程数据</p><div id="status" class="status">正在加载</div></header><main class="workspace"><section class="panel table-panel" id="desktopTablePanel"><div class="panel-title"><span>星期课表</span><span class="summary"><b id="count">0</b> 门课程 · <b id="total">0.0</b> 学分</span></div><div id="table" class="timetable"></div><div class="other"><b>其他时间</b><div id="other">暂无</div></div></section><section class="panel"><div class="panel-title">选择课程</div><div class="filters"><input id="search" class="search" placeholder="搜索课程、教师、番号、教室、备注或学科"><div class="filter-label">学科（可多选）</div><div id="departmentChips" class="chips"></div><div class="filter-grid"><select id="grade" class="select"><option value="">全部年级</option><option value="1">1年级</option><option value="2">2年级</option><option value="3">3年级</option><option value="4">4年级</option></select><select id="type" class="select"><option value="">全部形式</option><option value="面接">面接</option><option value="遠隔">遠隔</option></select><select id="requirement" class="select"><option value="">全部类别</option><option value="required">必修</option><option value="elective">选修</option></select><select id="retake" class="select"><option value="hide">隐藏再履修</option><option value="all">显示全部</option><option value="only">只看再履修</option></select><select id="visibility" class="select"><option value="normal">可选课程</option><option value="all">全部课程</option><option value="hidden">已隐藏课程</option></select></div><div class="checks"><label><input id="sixc" type="checkbox" checked> 排除非6C对象课程</label><label><input id="graduation" type="checkbox" checked> 隐藏卒業研究</label></div><div class="result"><span id="result">0 项课程</span></div></div><div id="list" class="course-list"><div class="empty">正在加载课程</div></div></section></main></div>
<button id="tableFab" class="table-fab" aria-label="打开课表">▦</button><div id="tableModal" class="table-modal" aria-hidden="true"><div class="table-dialog" role="dialog" aria-modal="true" aria-label="星期课表"><div class="table-dialog-head"><strong>星期课表</strong><span class="summary"><b id="modalCount">0</b> 门课程 · <b id="modalTotal">0.0</b> 学分</span><button id="tableClose" class="modal-close" aria-label="关闭">×</button></div><div class="modal-table-host"><div id="modalTable" class="timetable"></div><div class="other"><b>其他时间</b><div id="modalOther">暂无</div></div></div></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id),DAYS=['月','火','水','木','金','土'],PERIODS=[1,2,3,4,5,6],SCHEMA='tokai-timetable-v1',API='https://api.github.com/gists/ddfdf60dbff075ff8b810b84232cca21',DB='tokai-course-dev-v1',STORE='data';
let courses=[],departmentCodes=[],selectedDepartments=new Set(),variant={},temporaryId=null,currentData=null,selected=new Set(JSON.parse(localStorage.getItem('tokaiSelected')||'[]')),hidden=new Set(JSON.parse(localStorage.getItem('tokaiHidden')||'[]'));
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),key=c=>c.id,meet=c=>c.schedule.meetings,picked=()=>courses.filter(c=>selected.has(key(c))),slots=c=>new Set(meet(c).filter(m=>m.period).map(m=>`${m.day}-${m.period}`)),norm=v=>String(v||'').normalize('NFKC').replace(/\s+/g,'').toLowerCase(),mergeKey=c=>`${norm(c.name)}@@${meet(c).map(m=>`${m.day}${m.period||''}`).sort().join('|')}`;
const depts=c=>c.departments,displayDepts=c=>depts(c).includes('DA')?['DA']:depts(c),grades=c=>c.grade_years,isUniversalGrade=c=>{const g=grades(c);return g.length===0||(g.length===4&&[1,2,3,4].every(y=>g.includes(y)))},gradeLabel=c=>grades(c).map(y=>`${y}年级`).join('・');
function normalizeData(data){if(!data||data.schema!==SCHEMA||!Array.isArray(data.courses))throw Error('invalid');const top=Array.isArray(data.departments)?data.departments.map(String).filter(Boolean):[];for(const c of data.courses){if(!c||!c.id||!c.name)throw Error(`course:${c?.id||'unknown'}`);c.class_code=String(c.class_code||c.id);c.departments=Array.isArray(c.departments)&&c.departments.length?c.departments.map(String):top.slice(0,1);c.schedule=c.schedule||{};c.schedule.meetings=Array.isArray(c.schedule.meetings)?c.schedule.meetings:[];c.schedule.room=c.schedule.room??null;c.grade_years=Array.isArray(c.grade_years)?c.grade_years.map(Number).filter(y=>y>=1&&y<=4):[];c.flags=c.flags||{};c.flags.retake=c.flags.retake===true;c.flags.graduation=c.flags.graduation===true;c.flags.target_classes=Array.isArray(c.flags.target_classes)?c.flags.target_classes:[];c.flags.allowed_for_6c=c.flags.allowed_for_6c!==false;c.flags.other_departments_allowed=c.flags.other_departments_allowed===true;c.credits=Number(c.credits)||0}data.departments=[...new Set([...top,...data.courses.flatMap(c=>c.departments)])];return data}
function db(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function dbGet(k){const d=await db();return new Promise((ok,no)=>{const r=d.transaction(STORE).objectStore(STORE).get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function dbSet(k,v){const d=await db();return new Promise((ok,no)=>{const r=d.transaction(STORE,'readwrite').objectStore(STORE).put(v,k);r.onsuccess=()=>ok();r.onerror=()=>no(r.error)})}async function dbDel(k){const d=await db();return new Promise((ok,no)=>{const r=d.transaction(STORE,'readwrite').objectStore(STORE).delete(k);r.onsuccess=()=>ok();r.onerror=()=>no(r.error)})}
function apply(data,label){data=normalizeData(data);currentData=data;courses=data.courses;departmentCodes=data.departments;selectedDepartments=new Set(departmentCodes.includes('DA')?['DA']:[]);selected=new Set([...selected].filter(id=>courses.some(c=>c.id===id)));hidden=new Set([...hidden].filter(id=>courses.some(c=>c.id===id)));save();$('source').textContent=`${courses.length} 门课程 · ${departmentCodes.join(' / ')}`;$('status').textContent=label;$('status').className='status ready';render()}
function groups(a){const m=new Map;for(const c of a){const k=mergeKey(c);if(!m.has(k))m.set(k,{key:k,name:c.name,variants:[]});m.get(k).variants.push(c)}return[...m.values()]}
function conflicts(c){const s=slots(c);return picked().filter(x=>key(x)!==key(c)&&[...slots(x)].some(v=>s.has(v)))}function matchDept(c){return selectedDepartments.size===0||depts(c).some(d=>selectedDepartments.has(d))}function match(c){const mode=$('visibility').value,h=hidden.has(key(c)),q=$('search').value.trim().toLowerCase(),hay=[c.name,c.teacher,c.class_code,c.note,c.schedule.room,...depts(c)].join(' ').toLowerCase();return!(mode==='normal'&&h||mode==='hidden'&&!h)&&(!q||hay.includes(q))&&matchDept(c)&&(!$('grade').value||isUniversalGrade(c)||grades(c).includes(+$('grade').value))&&(!$('type').value||c.class_type===$('type').value)&&(!$('requirement').value||c.requirement_type===$('requirement').value)&&!($('retake').value==='hide'&&c.flags.retake)&&!($('retake').value==='only'&&!c.flags.retake)&&!($('sixc').checked&&!c.flags.allowed_for_6c)&&!($('graduation').checked&&c.flags.graduation)}
const rank=c=>{const o={月:0,火:1,水:2,木:3,金:4,土:5,他:8};return Math.min(...(meet(c).length?meet(c).map(m=>(o[m.day]??9)*20+(+m.period||9)):[999]))},save=()=>{localStorage.setItem('tokaiSelected',JSON.stringify([...selected]));localStorage.setItem('tokaiHidden',JSON.stringify([...hidden]))};
function renderDepartments(){$('departmentChips').innerHTML=`<button class="chip ${selectedDepartments.size===0?'active':''}" data-dept="__ALL__">全部</button>`+departmentCodes.map(d=>`<button class="chip ${selectedDepartments.has(d)?'active':''}" data-dept="${esc(d)}">${esc(d)}</button>`).join('');document.querySelectorAll('[data-dept]').forEach(b=>b.onclick=()=>{temporaryId=null;const d=b.dataset.dept;if(d==='__ALL__')selectedDepartments.clear();else if(selectedDepartments.has(d))selectedDepartments.delete(d);else selectedDepartments.add(d);render()})}
function renderList(){const target=temporaryId&&courses.find(c=>key(c)===temporaryId),visible=target?courses.filter(c=>mergeKey(c)===mergeKey(target)):courses.filter(match),list=groups(visible).map(g=>{g.variants.sort((a,b)=>rank(a)-rank(b));g.current=g.variants.find(v=>key(v)===variant[g.key])||g.variants.find(v=>selected.has(key(v)))||g.variants[0];variant[g.key]=key(g.current);return g}).sort((a,b)=>rank(a.current)-rank(b.current)||a.name.localeCompare(b.name,'ja'));$('result').textContent=target?'临时查看课程':`${list.length} 项课程 / ${visible.length} 个班级`;const sm=new Map;for(const g of list){const m=meet(g.current)[0],d=m&&DAYS.includes(m.day)?m.day:'其他',p=m?.period||'other';if(!sm.has(d))sm.set(d,new Map);if(!sm.get(d).has(p))sm.get(d).set(p,[]);sm.get(d).get(p).push(g)}const card=g=>{const c=g.current,on=g.variants.find(v=>selected.has(key(v))),blocked=!on&&conflicts(c).length,db=displayDepts(c).map(d=>`<span class="badge department">${esc(d)}</span>`).join('');return`<article class="course ${on?'selected':blocked?'blocked':''}" data-merge="${esc(g.key)}"><button class="add" data-g="${esc(g.key)}" ${blocked?'disabled':''}>${on?'移除':blocked?'冲突':'加入'}</button><button class="hide" data-hide="${esc(key(c))}">${hidden.has(key(c))?'取消隐藏':'隐藏'}</button><div class="course-name">${esc(c.name)}</div><div class="code">${esc(c.class_code)} · ${c.credits.toFixed(1)} 学分 · ${esc(meet(c).map(m=>`${m.day}${m.period||''}`).join('・')||'无固定时间')}${c.schedule.room?` · ${esc(c.schedule.room)}`:''}</div><div class="meta">${esc(c.teacher||'教师未填写')}${c.note?`<br>${esc(c.note)}`:''}</div><div class="badges">${c.class_type==='遠隔'?'<span class="badge">遠隔</span>':''}${c.requirement_label?`<span class="badge ${c.requirement_type==='required'?'required':''}">${esc(c.requirement_label)}</span>`:''}${!isUniversalGrade(c)?`<span class="badge grade">${esc(gradeLabel(c))}</span>`:''}${db}${c.flags.retake?'<span class="badge retake">再履修</span>':''}</div></article>`};$('list').innerHTML=[...sm].map(([d,ps])=>`<section class="weekday" data-list-day="${d}"><div class="weekday-title">${d==='其他'?'其他时间':d+'曜日'}</div>${[...ps].map(([p,a])=>`<section class="period-group" data-list-time="${d}-${p}"><div class="period-title">${p==='other'?'无固定时限':`${d}${p}`}</div>${a.map(card).join('')}</section>`).join('')}</section>`).join('')||'<div class="empty">没有符合条件的课程</div>';document.querySelectorAll('[data-hide]').forEach(b=>b.onclick=()=>{hidden.has(b.dataset.hide)?hidden.delete(b.dataset.hide):hidden.add(b.dataset.hide);save();render()});document.querySelectorAll('.add').forEach(b=>b.onclick=()=>{const g=list.find(x=>x.key===b.dataset.g),old=g?.variants.find(v=>selected.has(key(v)));if(!g)return;if(old)selected.delete(key(old));else if(!conflicts(g.current).length)selected.add(key(g.current));save();render()})}
function copyCode(id){const c=courses.find(v=>key(v)===id);if(!c)return;const a=document.createElement('textarea');a.value=c.class_code;a.style.position='fixed';a.style.left='-9999px';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}function locate(id){closeTable();const c=courses.find(v=>key(v)===id);if(!c)return;const g=mergeKey(c);variant[g]=id;temporaryId=match(c)?null:id;renderList();setTimeout(()=>{const e=[...document.querySelectorAll('.course')].find(x=>x.dataset.merge===g);if(e){e.scrollIntoView({behavior:'smooth',block:'center'});e.classList.add('located');setTimeout(()=>e.classList.remove('located'),1600)}},30)}
function scrollToDay(day){closeTable();renderList();requestAnimationFrame(()=>document.querySelector(`[data-list-day="${day}"]`)?.scrollIntoView({behavior:'smooth',block:'start'}))}function scrollToTime(day,period){closeTable();renderList();requestAnimationFrame(()=>{(document.querySelector(`[data-list-time="${day}-${period}"]`)||document.querySelector(`[data-list-day="${day}"]`))?.scrollIntoView({behavior:'smooth',block:'center'})})}
function tableMarkup(){const chosen=picked(),available=courses.filter(match),ss=new Set(available.flatMap(c=>meet(c).filter(m=>m.period).map(m=>`${m.day}-${m.period}`)));let out='<div class="cell head">限</div>'+DAYS.map(d=>`<div class="cell head day-head" data-jump-day="${d}">${d}</div>`).join('');for(const p of PERIODS){out+=`<div class="cell period">${p}</div>`;for(const d of DAYS){const list=chosen.filter(c=>meet(c).some(m=>m.day===d&&+m.period===p));out+=`<div class="cell empty-slot ${ss.has(`${d}-${p}`)?'available':'unavailable'}" data-jump-time="${d}-${p}">${list.map(c=>`<div class="slot ${match(c)?'':'filtered'}" data-course="${esc(key(c))}"><button class="remove" data-remove="${esc(key(c))}">×</button><b>${esc(c.name)}</b><span class="teacher">${esc(c.teacher||'')}</span><div class="slot-footer"><span class="slot-code">${esc(c.class_code)}</span><span class="credits">${c.credits.toFixed(1)}</span><span class="tiny ${c.class_type==='遠隔'?'remote':''}">${c.class_type==='遠隔'?'遠':'面'}</span></div></div>`).join('')}</div>`}}return out}
function bindTable(root){root.querySelectorAll('[data-jump-day]').forEach(el=>el.onclick=e=>{e.preventDefault();scrollToDay(el.dataset.jumpDay)});root.querySelectorAll('[data-jump-time]').forEach(el=>el.onclick=e=>{if(e.target.closest('[data-course]'))return;const [d,p]=el.dataset.jumpTime.split('-');scrollToTime(d,p)});root.querySelectorAll('[data-remove]').forEach(el=>el.onclick=e=>{e.stopPropagation();selected.delete(el.dataset.remove);save();render()});root.querySelectorAll('[data-course]').forEach(el=>el.onclick=e=>{e.stopPropagation();copyCode(el.dataset.course);locate(el.dataset.course)})}
function renderTable(){const markup=tableMarkup();$('table').innerHTML=markup;$('modalTable').innerHTML=markup;bindTable($('table'));bindTable($('modalTable'));const p=picked(),other=p.filter(c=>!meet(c).some(m=>DAYS.includes(m.day)&&m.period)),text=other.length?other.map(c=>c.name).join(' · '):'暂无';$('other').textContent=text;$('modalOther').textContent=text;$('count').textContent=$('modalCount').textContent=p.length;const total=p.reduce((s,c)=>s+c.credits,0).toFixed(1);$('total').textContent=$('modalTotal').textContent=total}
function render(){renderDepartments();renderList();renderTable()}
function openTable(){$('tableModal').classList.add('open');$('tableModal').setAttribute('aria-hidden','false');document.body.classList.add('modal-open');renderTable()}function closeTable(){$('tableModal').classList.remove('open');$('tableModal').setAttribute('aria-hidden','true');document.body.classList.remove('modal-open')}$('tableFab').onclick=openTable;$('tableClose').onclick=closeTable;$('tableModal').onclick=e=>{if(e.target===$('tableModal'))closeTable()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeTable();if(e.altKey&&e.shiftKey&&e.code==='KeyJ'){$('devFile').click()}else if(e.altKey&&e.shiftKey&&e.code==='KeyR')restore()});
async function online(){const r=await fetch(API,{cache:'no-store'}),gist=await r.json(),f=Object.values(gist.files||{}).find(x=>x.filename?.endsWith('.json'));let text=f.content;if(f.truncated)text=await(await fetch(f.raw_url)).text();const data=normalizeData(JSON.parse(text));return{data,label:`已同步网络数据 · 更新 ${String(gist.updated_at||'').slice(0,10)}`}}async function startup(){try{const active=await dbGet('active');if(active)return apply(active,'本地开发数据')}catch(_){}try{const o=await online();apply(o.data,o.label)}catch(_){$('source').textContent='网络数据不可用';$('status').textContent='课程数据不可用';$('status').className='status error'}}
$('devFile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const data=normalizeData(JSON.parse(await f.text()));if(currentData)await dbSet('backup',currentData);await dbSet('active',data);apply(data,'本地开发数据')}catch(_){$('status').textContent='JSON 格式错误';$('status').className='status error'}};async function restore(){try{const backup=await dbGet('backup');if(backup){await dbSet('active',backup);await dbDel('backup');return apply(backup,'本地恢复数据')}await dbDel('active');const o=await online();apply(o.data,o.label)}catch(_){}}
['search','grade','type','requirement','retake','visibility','sixc','graduation'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',()=>{temporaryId=null;render()}));startup();
</script></body></html>
